<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Periodiek systeem (deel)</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <table class="ptable">
    <thead>
      <tr>
        <th class="head">Group</th>
        <th class="head">1</th>
        <th class="head">2</th>
        <th class="head">3</th>
        <th class="head">4</th>
        <th class="head">5</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <th class="side">Period 1</th>
        <td class="cell orange hydrogen">
          <a class="element" href="https://en.wikipedia.org/wiki/Hydrogen" target="_blank" rel="noopener">
            <span class="number">1</span>
            <span class="symbol">H</span>
          </a>
        </td>
        <td class="empty"></td>
        <td class="empty"></td>
        <td class="empty"></td>
        <td class="empty"></td>
      </tr>

      <tr>
        <th class="side">2</th>
        <td class="cell purple">
          <a class="element" href="https://en.wikipedia.org/wiki/Lithium" target="_blank" rel="noopener">
            <span class="number">3</span>
            <span class="symbol">Li</span>
          </a>
        </td>
        <td class="cell blue">
          <a class="element" href="https://en.wikipedia.org/wiki/Beryllium" target="_blank" rel="noopener">
            <span class="number">4</span>
            <span class="symbol">Be</span>
          </a>
        </td>
        <td class="empty"></td>
        <td class="empty"></td>
        <td class="empty"></td>
      </tr>

      <tr>
        <th class="side">3</th>
        <td class="cell purple">
          <a class="element" href="https://en.wikipedia.org/wiki/Sodium" target="_blank" rel="noopener">
            <span class="number">11</span>
            <span class="symbol">Na</span>
          </a>
        </td>
        <td class="cell blue">
          <a class="element" href="https://en.wikipedia.org/wiki/Magnesium" target="_blank" rel="noopener">
            <span class="number">12</span>
            <span class="symbol">Mg</span>
          </a>
        </td>
        <td class="empty"></td>
        <td class="empty"></td>
        <td class="empty"></td>
      </tr>

      <tr>
        <th class="side">4</th>
        <td class="cell purple">
          <a class="element" href="https://en.wikipedia.org/wiki/Potassium" target="_blank" rel="noopener">
            <span class="number">19</span>
            <span class="symbol">K</span>
          </a>
        </td>
        <td class="cell blue">
          <a class="element" href="https://en.wikipedia.org/wiki/Calcium" target="_blank" rel="noopener">
            <span class="number">20</span>
            <span class="symbol">Ca</span>
          </a>
        </td>
        <td class="cell yellow">
          <a class="element" href="https://en.wikipedia.org/wiki/Scandium" target="_blank" rel="noopener">
            <span class="number">21</span>
            <span class="symbol">Sc</span>
          </a>
        </td>
        <td class="cell yellow">
          <a class="element" href="https://en.wikipedia.org/wiki/Titanium" target="_blank" rel="noopener">
            <span class="number">22</span>
            <span class="symbol">Ti</span>
          </a>
        </td>
        <td class="cell yellow">
          <a class="element" href="https://en.wikipedia.org/wiki/Vanadium" target="_blank" rel="noopener">
            <span class="number">23</span>
            <span class="symbol">V</span>
          </a>
        </td>
      </tr>

      <tr>
        <th class="side">5</th>
        <td class="cell purple">
          <a class="element" href="https://en.wikipedia.org/wiki/Rubidium" target="_blank" rel="noopener">
            <span class="number">37</span>
            <span class="symbol">Rb</span>
          </a>
        </td>
        <td class="cell blue">
          <a class="element" href="https://en.wikipedia.org/wiki/Strontium" target="_blank" rel="noopener">
            <span class="number">38</span>
            <span class="symbol">Sr</span>
          </a>
        </td>
        <td class="cell yellow">
          <a class="element" href="https://en.wikipedia.org/wiki/Yttrium" target="_blank" rel="noopener">
            <span class="number">39</span>
            <span class="symbol">Y</span>
          </a>
        </td>
        <td class="cell yellow">
          <a class="element" href="https://en.wikipedia.org/wiki/Zirconium" target="_blank" rel="noopener">
            <span class="number">40</span>
            <span class="symbol">Zr</span>
          </a>
        </td>
        <td class="cell yellow">
          <a class="element" href="https://en.wikipedia.org/wiki/Niobium" target="_blank" rel="noopener">
            <span class="number">41</span>
            <span class="symbol">Nb</span>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>

<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mijn toernooi</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Schaats toernooi</h1>
  <h2>Overzicht van de wedstrijden</h2>

  <table>
    <thead>
      <tr>
        <th>Tijd</th>
        <th>Speler 1</th>
        <th>Speler 2</th>
        <th>Winnaar</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td><input type="time" name="tijd_1" aria-label="Tijd wedstrijd 1"></td>
        <td><input type="text" name="speler1_1" placeholder="naam"></td>
        <td><input type="text" name="speler2_1" placeholder="naam"></td>
        <td><input type="text" name="winnaar_1" placeholder="naam"></td>
      </tr>

      <tr>
        <td><input type="time" name="tijd_2" aria-label="Tijd wedstrijd 2"></td>
        <td><input type="text" name="speler1_2" placeholder="naam"></td>
        <td><input type="text" name="speler2_2" placeholder="naam"></td>
        <td><input type="text" name="winnaar_2" placeholder="naam"></td>
      </tr>

      <tr>
        <td><input type="time" name="tijd_3" aria-label="Tijd wedstrijd 3"></td>
        <td><input type="text" name="speler1_3" placeholder="naam"></td>
        <td><input type="text" name="speler2_3" placeholder="naam"></td>
        <td><input type="text" name="winnaar_3" placeholder="naam"></td>
      </tr>

      <tr>
        <td><input type="time" name="tijd_4" aria-label="Tijd wedstrijd 4"></td>
        <td><input type="text" name="speler1_4" placeholder="naam"></td>
        <td><input type="text" name="speler2_4" placeholder="naam"></td>
        <td><input type="text" name="winnaar_4" placeholder="naam"></td>
      </tr>

      <tr>
        <td><input type="time" name="tijd_5" aria-label="Tijd wedstrijd 5"></td>
        <td><input type="text" name="speler1_5" placeholder="naam"></td>
        <td><input type="text" name="speler2_5" placeholder="naam"></td>
        <td><input type="text" name="winnaar_5" placeholder="naam"></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
